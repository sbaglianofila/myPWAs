<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a1a2e">
<meta name="description" content="Le tue date importanti sempre a portata di mano">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Datekeeper">
<link rel="manifest" href="manifest.json">
<title>Datekeeper</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f1a;
    --surface: #1a1a2e;
    --surface2: #22223b;
    --border: #2d2d4e;
    --text: #e8e8f0;
    --text-muted: #7070a0;
    --accent: #c084fc;
    --accent2: #818cf8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    max-width: 480px;
    margin: 0 auto;
    overflow-x: hidden;
  }
  .header {
    padding: 20px 20px 0;
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--bg);
  }
  .app-title {
    font-family: 'DM Serif Display', serif;
    font-size: 28px;
    color: var(--text);
    letter-spacing: -0.5px;
  }
  .app-subtitle {
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 300;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-bottom: 16px;
  }
  .tabs {
    display: flex;
    gap: 4px;
    background: var(--surface);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 16px;
  }
  .tab-btn {
    flex: 1;
    padding: 8px;
    border: none;
    background: transparent;
    color: var(--text-muted);
    border-radius: 9px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
  }
  .tab-btn.active {
    background: var(--surface2);
    color: var(--text);
    box-shadow: 0 1px 4px rgba(0,0,0,0.3);
  }
  .cat-filters {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 0 20px 12px;
    scrollbar-width: none;
  }
  .cat-filters::-webkit-scrollbar { display: none; }
  .cat-chip {
    flex-shrink: 0;
    padding: 5px 14px;
    border-radius: 20px;
    border: 1.5px solid var(--border);
    background: transparent;
    color: var(--text-muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .cat-chip.active { color: #fff; border-color: transparent; }

  /* CALENDARIO */
  .calendar-view { padding: 0 20px 100px; }
  .cal-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .cal-nav-btn {
    background: var(--surface);
    border: none;
    color: var(--text);
    width: 36px;
    height: 36px;
    border-radius: 10px;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .cal-month-title { font-family: 'DM Serif Display', serif; font-size: 20px; }
  .cal-grid-header {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    text-align: center;
    margin-bottom: 8px;
  }
  .cal-day-name {
    font-size: 11px;
    color: var(--text-muted);
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 4px 0;
  }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
  }
  .cal-cell {
    aspect-ratio: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.15s;
    padding: 2px;
  }
  .cal-cell:hover { background: var(--surface); }
  .cal-cell.today {
    background: var(--surface2);
    border: 1.5px solid var(--border);
  }
  .cal-cell.today .cal-day-num { color: var(--accent); font-weight: 600; }
  .cal-cell.other-month .cal-day-num { color: var(--border); }
  .cal-day-num { font-size: 13px; color: var(--text); line-height: 1; margin-bottom: 3px; }
  .cal-dots { display: flex; gap: 2px; flex-wrap: wrap; justify-content: center; max-width: 28px; }
  .cal-dot { width: 5px; height: 5px; border-radius: 50%; }
  .day-events {
    margin-top: 16px;
    padding: 16px;
    background: var(--surface);
    border-radius: 16px;
    border: 1px solid var(--border);
    min-height: 80px;
  }
  .day-events-title {
    font-size: 12px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 10px;
  }

  /* LISTA */
  .list-view { padding: 0 20px 100px; }
  .list-section-title {
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 600;
    margin: 20px 0 8px;
  }
  .event-card {
    background: var(--surface);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 8px;
    border-left: 4px solid transparent;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    transition: transform 0.15s;
    position: relative;
  }
  .event-card:active { transform: scale(0.98); }
  .event-body { flex: 1; min-width: 0; }
  .event-name {
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .event-meta {
    font-size: 12px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .event-cat-label {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 20px;
    font-size: 10px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 0.3px;
  }
  .event-date-badge { flex-shrink: 0; text-align: right; }
  .event-days-left {
    font-size: 22px;
    font-weight: 600;
    font-family: 'DM Serif Display', serif;
    line-height: 1;
  }
  .event-days-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; }

  /* FAB */
  .fab {
    position: fixed;
    bottom: 28px;
    right: 50%;
    transform: translateX(50%) translateX(min(220px, 45vw));
    width: 56px;
    height: 56px;
    border-radius: 18px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none;
    color: white;
    font-size: 32px;
    font-weight: 300;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(192,132,252,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 200;
    line-height: 1;
    padding-bottom: 2px;
  }
  .fab:active { opacity: 0.85; }

  /* MODAL */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(4px);
    z-index: 300;
    display: flex;
    align-items: flex-end;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal {
    background: var(--surface);
    border-radius: 24px 24px 0 0;
    padding: 24px 24px 40px;
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    transform: translateY(40px);
    transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal-overlay.open .modal { transform: translateY(0); }
  .modal-handle {
    width: 40px;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin: 0 auto 20px;
  }
  .modal-title {
    font-family: 'DM Serif Display', serif;
    font-size: 22px;
    margin-bottom: 20px;
    color: var(--text);
  }
  .form-group { margin-bottom: 16px; }
  .form-label {
    font-size: 12px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: 600;
    margin-bottom: 8px;
    display: block;
  }
  .form-input {
    width: 100%;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s;
  }
  .form-input:focus { border-color: var(--accent); }

  /* CATEGORIE - bottoni colorati, 2 colonne */
  .cat-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }
  .cat-option {
    padding: 13px 10px;
    border-radius: 12px;
    border: 2px solid var(--border);
    background: var(--surface2);
    color: var(--text-muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
    transition: all 0.2s;
  }
  .cat-option.selected { color: #fff; border-color: transparent; }

  /* RIPETIZIONE */
  .repeat-options {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }
  .repeat-option {
    padding: 12px 10px;
    border-radius: 12px;
    border: 1.5px solid var(--border);
    background: var(--surface2);
    color: var(--text-muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    text-align: center;
    transition: all 0.2s;
  }
  .repeat-option.selected { border-color: var(--accent); color: var(--accent); background: rgba(192,132,252,0.08); }

  .custom-interval { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
  .custom-interval input { width: 70px; text-align: center; }
  .custom-interval select { flex: 1; }

  .btn-primary {
    width: 100%;
    padding: 15px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none;
    border-radius: 14px;
    color: white;
    font-family: 'DM Sans', sans-serif;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
  }
  .btn-primary:active { opacity: 0.85; }
  textarea.form-input { resize: none; height: 80px; }

  /* DETTAGLIO */
  .detail-cat-bar { height: 6px; border-radius: 3px; margin-bottom: 20px; }
  .detail-event-name { font-family: 'DM Serif Display', serif; font-size: 26px; margin-bottom: 8px; }
  .detail-cat-badge {
    display: inline-block;
    padding: 4px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
    color: #fff;
    margin-bottom: 20px;
    letter-spacing: 0.3px;
  }
  .detail-days-big {
    text-align: center;
    margin: 16px 0;
    padding: 20px;
    background: var(--surface2);
    border-radius: 16px;
  }
  .detail-days-num {
    font-family: 'DM Serif Display', serif;
    font-size: 60px;
    line-height: 1;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .detail-days-label { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
  .detail-info-row {
    display: flex;
    justify-content: space-between;
    padding: 13px 0;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
    gap: 12px;
  }
  .detail-info-label { color: var(--text-muted); flex-shrink: 0; }
  .detail-info-value { color: var(--text); font-weight: 500; text-align: right; }
  .btn-danger {
    width: 100%;
    padding: 14px;
    background: transparent;
    border: 1.5px solid #ef4444;
    border-radius: 14px;
    color: #ef4444;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 12px;
  }
  .btn-danger:active { background: rgba(239,68,68,0.1); }
  .today-badge {
    display: inline-block;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: white;
    font-size: 10px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 20px;
    margin-left: 6px;
    vertical-align: middle;
  }
  .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); }
  .empty-state-text { font-size: 14px; line-height: 1.6; }
  ::-webkit-scrollbar { width: 0; }
</style>
</head>
<body>

<div class="header">
  <div class="app-title">Date Importanti</div>
  <div class="app-subtitle">Le tue ricorrenze personali</div>
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('calendar')">Calendario</button>
    <button class="tab-btn" onclick="switchTab('list')">Lista</button>
  </div>
</div>

<div class="cat-filters" id="catFilters"></div>

<div class="calendar-view" id="calendarView">
  <div class="cal-nav">
    <button class="cal-nav-btn" onclick="changeMonth(-1)">&#8249;</button>
    <div class="cal-month-title" id="calMonthTitle"></div>
    <button class="cal-nav-btn" onclick="changeMonth(1)">&#8250;</button>
  </div>
  <div class="cal-grid-header" id="calGridHeader"></div>
  <div class="cal-grid" id="calGrid"></div>
  <div class="day-events" id="dayEvents">
    <div class="day-events-title">Tocca un giorno per vedere gli eventi</div>
  </div>
</div>

<div class="list-view" id="listView" style="display:none"></div>

<button class="fab" onclick="openAddModal()">+</button>

<!-- MODAL AGGIUNGI -->
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">Nuova data</div>
    <div class="form-group">
      <label class="form-label">Nome evento</label>
      <input type="text" class="form-input" id="inputName" placeholder="Es. Compleanno di Marco">
    </div>
    <div class="form-group">
      <label class="form-label">Categoria</label>
      <div class="cat-grid" id="catGrid"></div>
    </div>
    <div class="form-group">
      <label class="form-label">Data</label>
      <input type="date" class="form-input" id="inputDate">
    </div>
    <div class="form-group">
      <label class="form-label">Ripetizione</label>
      <div class="repeat-options" id="repeatOptions"></div>
      <div class="custom-interval" id="customInterval" style="display:none">
        <input type="number" class="form-input" id="intervalNum" min="1" value="1">
        <select class="form-input" id="intervalUnit">
          <option value="days">Giorni</option>
          <option value="weeks">Settimane</option>
          <option value="months">Mesi</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Note (opzionale)</label>
      <textarea class="form-input" id="inputNotes" placeholder="Aggiungi una nota..."></textarea>
    </div>
    <button class="btn-primary" onclick="saveEvent()">Salva</button>
  </div>
</div>

<!-- MODAL DETTAGLIO -->
<div class="modal-overlay" id="detailModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div id="detailContent"></div>
    <button class="btn-danger" onclick="deleteCurrentEvent()">Elimina evento</button>
  </div>
</div>

<script>
const CATEGORIES = [
  { id:'importanti', label:'Importanti',          color:'#e11d48' },
  { id:'famiglia',   label:'Famiglia & Amici',    color:'#f97316' },
  { id:'ricorrenze', label:'Ricorrenze',           color:'#ec4899' },
  { id:'salute',     label:'Salute & Medicina',   color:'#0891b2' },
  { id:'casa',       label:'Casa & Manutenzioni', color:'#65a30d' },
  { id:'veicoli',    label:'Veicoli',              color:'#ca8a04' },
  { id:'lavoro',     label:'Lavoro & Scadenze',   color:'#6366f1' },
];

const REPEAT_OPTIONS = [
  { id:'none',    label:'Una volta' },
  { id:'yearly',  label:'Ogni anno' },
  { id:'monthly', label:'Ogni mese' },
  { id:'custom',  label:'Personalizzata' },
];

const DAY_NAMES   = ['Dom','Lun','Mar','Mer','Gio','Ven','Sab'];
const MONTH_NAMES = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno',
                     'Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];

let events         = JSON.parse(localStorage.getItem('date_importanti')||'[]');
let currentTab     = 'calendar';
let currentFilter  = 'all';
let calDate        = new Date();
let selectedDay    = null;
let currentDetailId= null;
let selectedCat    = null;
let selectedRepeat = 'yearly';

function saveData(){ localStorage.setItem('date_importanti', JSON.stringify(events)); }
function getCat(id){ return CATEGORIES.find(c=>c.id===id)||CATEGORIES[0]; }

function getNextOccurrence(ev){
  const today=new Date(); today.setHours(0,0,0,0);
  const base=new Date(ev.date);
  if(ev.repeat==='none')    return base>=today?base:null;
  if(ev.repeat==='yearly'){  let c=new Date(today.getFullYear(),base.getMonth(),base.getDate()); if(c<today)c.setFullYear(c.getFullYear()+1); return c; }
  if(ev.repeat==='monthly'){ let c=new Date(today.getFullYear(),today.getMonth(),base.getDate()); if(c<today)c.setMonth(c.getMonth()+1); return c; }
  if(ev.repeat==='custom'){
    const n=ev.intervalNum||1, u=ev.intervalUnit||'days';
    let c=new Date(base); c.setHours(0,0,0,0);
    while(c<today){
      if(u==='days')c.setDate(c.getDate()+n);
      else if(u==='weeks')c.setDate(c.getDate()+n*7);
      else if(u==='months')c.setMonth(c.getMonth()+n);
    }
    return c;
  }
  return base;
}

function daysUntil(date){
  if(!date)return null;
  const t=new Date(); t.setHours(0,0,0,0);
  const d=new Date(date); d.setHours(0,0,0,0);
  return Math.round((d-t)/86400000);
}

function formatRepeat(ev){
  if(ev.repeat==='none')   return 'Evento singolo';
  if(ev.repeat==='yearly') return 'Ogni anno';
  if(ev.repeat==='monthly')return 'Ogni mese';
  if(ev.repeat==='custom'){
    const u=ev.intervalUnit==='days'?'giorni':ev.intervalUnit==='weeks'?'settimane':'mesi';
    return `Ogni ${ev.intervalNum} ${u}`;
  }
  return '';
}

function formatDate(s){ const d=new Date(s); return `${d.getDate()} ${MONTH_NAMES[d.getMonth()]} ${d.getFullYear()}`; }

function getEventsForDay(year,month,day){
  const target=new Date(year,month,day); target.setHours(0,0,0,0);
  return events.filter(ev=>{
    const base=new Date(ev.date);
    if(ev.repeat==='none')   return base.getFullYear()===year&&base.getMonth()===month&&base.getDate()===day;
    if(ev.repeat==='yearly') return base.getMonth()===month&&base.getDate()===day;
    if(ev.repeat==='monthly')return base.getDate()===day;
    if(ev.repeat==='custom'){
      const n=ev.intervalNum||1,u=ev.intervalUnit||'days';
      let c=new Date(base); c.setHours(0,0,0,0);
      if(c.getTime()===target.getTime())return true;
      while(c<target){
        if(u==='days')c.setDate(c.getDate()+n);
        else if(u==='weeks')c.setDate(c.getDate()+n*7);
        else if(u==='months')c.setMonth(c.getMonth()+n);
        if(c.getTime()===target.getTime())return true;
        if(c>target)break;
      }
    }
    return false;
  });
}

function switchTab(tab){
  currentTab=tab;
  document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('active',(i===0&&tab==='calendar')||(i===1&&tab==='list')));
  document.getElementById('calendarView').style.display=tab==='calendar'?'block':'none';
  document.getElementById('listView').style.display=tab==='list'?'block':'none';
  render();
}

function renderFilters(){
  const all=[{id:'all',label:'Tutte',color:'#c084fc'},...CATEGORIES];
  document.getElementById('catFilters').innerHTML=all.map(c=>`
    <button class="cat-chip ${currentFilter===c.id?'active':''}"
      style="${currentFilter===c.id?`background:${c.color};`:''}"
      onclick="setFilter('${c.id}')">${c.label.split(' ')[0]}</button>`).join('');
}

function setFilter(id){ currentFilter=id; renderFilters(); render(); }
function filteredEvents(){ return currentFilter==='all'?events:events.filter(e=>e.category===currentFilter); }

function renderCalendar(){
  const year=calDate.getFullYear(),month=calDate.getMonth(),today=new Date();
  document.getElementById('calMonthTitle').textContent=`${MONTH_NAMES[month]} ${year}`;
  document.getElementById('calGridHeader').innerHTML=DAY_NAMES.map(d=>`<div class="cal-day-name">${d}</div>`).join('');
  const firstDay=new Date(year,month,1).getDay();
  const daysInMonth=new Date(year,month+1,0).getDate();
  const daysInPrev=new Date(year,month,0).getDate();
  let cells='';
  for(let i=firstDay-1;i>=0;i--)cells+=`<div class="cal-cell other-month"><span class="cal-day-num">${daysInPrev-i}</span></div>`;
  for(let d=1;d<=daysInMonth;d++){
    const isToday=today.getFullYear()===year&&today.getMonth()===month&&today.getDate()===d;
    const isSel=selectedDay&&selectedDay.year===year&&selectedDay.month===month&&selectedDay.day===d;
    const dayEvs=getEventsForDay(year,month,d).filter(e=>currentFilter==='all'||e.category===currentFilter);
    const dots=dayEvs.slice(0,3).map(e=>`<div class="cal-dot" style="background:${getCat(e.category).color}"></div>`).join('');
    cells+=`<div class="cal-cell ${isToday?'today':''}" onclick="selectDay(${year},${month},${d})"
      style="${isSel?'background:var(--surface2);outline:2px solid var(--accent)':''}">
      <span class="cal-day-num">${d}</span>
      <div class="cal-dots">${dots}</div></div>`;
  }
  const rem=42-(firstDay+daysInMonth);
  for(let d=1;d<=rem;d++)cells+=`<div class="cal-cell other-month"><span class="cal-day-num">${d}</span></div>`;
  document.getElementById('calGrid').innerHTML=cells;
  renderDayEvents();
}

function selectDay(y,m,d){ selectedDay={year:y,month:m,day:d}; renderCalendar(); }

function renderDayEvents(){
  const container=document.getElementById('dayEvents');
  if(!selectedDay){ container.innerHTML='<div class="day-events-title">Tocca un giorno per vedere gli eventi</div>'; return; }
  const {year,month,day}=selectedDay;
  const dayEvs=getEventsForDay(year,month,day).filter(e=>currentFilter==='all'||e.category===currentFilter);
  const today=new Date();
  const isToday=today.getFullYear()===year&&today.getMonth()===month&&today.getDate()===day;
  container.innerHTML=`
    <div class="day-events-title">${day} ${MONTH_NAMES[month]} ${year}${isToday?'<span class="today-badge">Oggi</span>':''}</div>
    ${dayEvs.length===0
      ?'<div style="color:var(--text-muted);font-size:13px">Nessun evento in questo giorno</div>'
      :dayEvs.map(ev=>renderEventCard(ev,false)).join('')}`;
}

function changeMonth(dir){ calDate.setMonth(calDate.getMonth()+dir); selectedDay=null; renderCalendar(); }

function renderList(){
  const container=document.getElementById('listView');
  const evs=filteredEvents().map(ev=>({...ev,next:getNextOccurrence(ev)}));
  const upcoming=evs.filter(e=>e.next!==null&&daysUntil(e.next)>=0).sort((a,b)=>a.next-b.next);
  const past=evs.filter(e=>e.next===null||daysUntil(e.next)<0).sort((a,b)=>new Date(b.date)-new Date(a.date));
  let html='';
  if(!upcoming.length&&!past.length){
    html='<div class="empty-state"><div class="empty-state-text">Nessuna data salvata.<br>Tocca + per aggiungerne una.</div></div>';
  } else {
    if(upcoming.length)html+=`<div class="list-section-title">Prossimi eventi</div>`+upcoming.map(ev=>renderEventCard(ev,true)).join('');
    if(past.length)html+=`<div class="list-section-title">Passati / Completati</div>`+past.map(ev=>renderEventCard(ev,true)).join('');
  }
  container.innerHTML=html;
}

function renderEventCard(ev,showDays){
  const cat=getCat(ev.category);
  const next=getNextOccurrence(ev);
  const days=daysUntil(next);
  const nextStr=next?`${next.getDate()} ${MONTH_NAMES[next.getMonth()]}`:formatDate(ev.date);
  let daysHtml='';
  if(showDays&&days!==null){
    const col=days===0?cat.color:days<=7?'#f97316':'var(--text)';
    const txt=days===0?'Oggi':days<0?'—':`${days}`;
    const lbl=days>0?'giorni':'';
    daysHtml=`<div class="event-date-badge">
      <div class="event-days-left" style="color:${col}">${txt}</div>
      <div class="event-days-label">${lbl}</div></div>`;
  }
  return `<div class="event-card" style="border-left-color:${cat.color}" onclick="openDetail('${ev.id}')">
    <div class="event-body">
      <div class="event-name">${ev.name}</div>
      <div class="event-meta">
        <span class="event-cat-label" style="background:${cat.color}">${cat.label.split(' ')[0]}</span>
        ${nextStr} &middot; ${formatRepeat(ev)}
      </div>
    </div>${daysHtml}</div>`;
}

function buildAddModal(){
  document.getElementById('catGrid').innerHTML=CATEGORIES.map(c=>`
    <button class="cat-option ${selectedCat===c.id?'selected':''}"
      style="${selectedCat===c.id?`background:${c.color};border-color:${c.color};`:`border-color:${c.color}55;`}"
      onclick="selectCat('${c.id}')">${c.label}</button>`).join('');
  document.getElementById('repeatOptions').innerHTML=REPEAT_OPTIONS.map(r=>`
    <button class="repeat-option ${selectedRepeat===r.id?'selected':''}"
      onclick="selectRepeat('${r.id}')">${r.label}</button>`).join('');
  document.getElementById('customInterval').style.display=selectedRepeat==='custom'?'flex':'none';
}

function openAddModal(){
  selectedCat=null; selectedRepeat='yearly';
  document.getElementById('inputName').value='';
  document.getElementById('inputDate').value=new Date().toISOString().split('T')[0];
  document.getElementById('inputNotes').value='';
  buildAddModal();
  document.getElementById('addModal').classList.add('open');
}

function selectCat(id){ selectedCat=id; buildAddModal(); }
function selectRepeat(id){ selectedRepeat=id; buildAddModal(); }

function saveEvent(){
  const name=document.getElementById('inputName').value.trim();
  const date=document.getElementById('inputDate').value;
  const notes=document.getElementById('inputNotes').value.trim();
  if(!name){ alert("Inserisci un nome per l'evento"); return; }
  if(!date){ alert('Inserisci una data'); return; }
  if(!selectedCat){ alert('Seleziona una categoria'); return; }
  const ev={id:Date.now().toString(),name,date,category:selectedCat,repeat:selectedRepeat,notes};
  if(selectedRepeat==='custom'){
    ev.intervalNum=parseInt(document.getElementById('intervalNum').value)||1;
    ev.intervalUnit=document.getElementById('intervalUnit').value;
  }
  events.push(ev); saveData();
  document.getElementById('addModal').classList.remove('open');
  render();
}

function openDetail(id){
  const ev=events.find(e=>e.id===id); if(!ev)return;
  currentDetailId=id;
  const cat=getCat(ev.category);
  const next=getNextOccurrence(ev);
  const days=daysUntil(next);
  let daysSection='';
  if(days!==null){
    const txt=days===0?'Oggi':days<0?'Passato':`${days}`;
    const lbl=days>0?'giorni al prossimo':days===0?'':' ';
    daysSection=`<div class="detail-days-big">
      <div class="detail-days-num">${txt}</div>
      <div class="detail-days-label">${lbl}</div></div>`;
  }
  document.getElementById('detailContent').innerHTML=`
    <div class="detail-cat-bar" style="background:${cat.color}"></div>
    <div class="detail-event-name">${ev.name}</div>
    <span class="detail-cat-badge" style="background:${cat.color}">${cat.label}</span>
    ${daysSection}
    <div class="detail-info-row"><span class="detail-info-label">Data originale</span><span class="detail-info-value">${formatDate(ev.date)}</span></div>
    ${next?`<div class="detail-info-row"><span class="detail-info-label">Prossima occorrenza</span><span class="detail-info-value">${next.getDate()} ${MONTH_NAMES[next.getMonth()]} ${next.getFullYear()}</span></div>`:''}
    <div class="detail-info-row"><span class="detail-info-label">Ripetizione</span><span class="detail-info-value">${formatRepeat(ev)}</span></div>
    ${ev.notes?`<div class="detail-info-row"><span class="detail-info-label">Note</span><span class="detail-info-value">${ev.notes}</span></div>`:''}`;
  document.getElementById('detailModal').classList.add('open');
}

function deleteCurrentEvent(){
  if(!currentDetailId)return;
  const ev=events.find(e=>e.id===currentDetailId); if(!ev)return;
  if(confirm(`Eliminare "${ev.name}"?`)){
    events=events.filter(e=>e.id!==currentDetailId); saveData();
    document.getElementById('detailModal').classList.remove('open');
    render();
  }
}

document.querySelectorAll('.modal-overlay').forEach(o=>{
  o.addEventListener('click',e=>{ if(e.target===o)o.classList.remove('open'); });
});

function render(){ renderFilters(); if(currentTab==='calendar')renderCalendar(); else renderList(); }
render();
</script>

<script>
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
navigator.storage.persist().catch(()=>{});
</script>
</body>
